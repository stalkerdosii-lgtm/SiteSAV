{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
    <h2>{{ product.name }}</h2>
    <p>Категория: {{ product.category.name }}</p>
    <p>Цена: {{ product.price }} ₽</p>
    <p>{{ product.description }}</p>
    <a href="{% url 'catalog:product_list' %}">← Назад в каталог</a>
{% endblock %}
