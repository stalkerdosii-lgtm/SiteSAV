{% extends 'base.html' %}

{% block title %}Товары{% endblock %}

{% block content %}
    <h2>Каталог товаров</h2>

    <ul>
        {% for product in products %}
            <li>
                <a href="{% url 'catalog:product_detail' product.slug %}">
                    {{ product.name }}
                </a>
                — {{ product.price }} ₽
            </li>
        {% empty %}
            <li>Товаров пока нет</li>
        {% endfor %}
    </ul>
{% endblock %}
