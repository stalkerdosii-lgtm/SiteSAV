<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Магазин{% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'home' %}">Универсальная база</a></h1>
        <nav>
            <a href="{% url 'catalog:product_list' %}">Каталог</a>

            {% if user.is_authenticated %}
                <a href="{% url 'cart:cart_detail' %}">Корзина</a>
                <a href="{% url 'users:profile' %}">{{ user.username }}</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
